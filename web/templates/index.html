<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Video Service Center</title>
    <!-- Premium Font -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        premium: '#0f172a',
                        accent: '#4f46e5',
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Scrollbar for a premium feel */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .glass-sidebar { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 antialiased selection:bg-accent selection:text-white">

    <!-- Premium Navbar -->
    <nav class="glass-nav fixed w-full top-0 z-50 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-20">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg shadow-indigo-200">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
                <h1 class="text-xl md:text-2xl font-extrabold tracking-tight text-premium">
                    Audio Video <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600">Center</span>
                </h1>
            </div>
            
            <button onclick="toggleCart()" class="group relative inline-flex items-center justify-center gap-2 bg-white border border-slate-200 text-slate-700 px-5 py-2.5 rounded-full font-semibold hover:bg-slate-50 hover:border-slate-300 transition-all shadow-sm hover:shadow">
                <svg class="w-5 h-5 text-slate-500 group-hover:text-indigo-600 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                <span>Cart</span>
                <span id="cart-count" class="absolute -top-1 -right-1 bg-indigo-600 text-white text-xs font-bold px-2 py-0.5 rounded-full shadow-sm transition-transform duration-300">0</span>
            </button>
        </div>
    </nav>

    <!-- Hero Banner Section -->
    <div class="relative pt-32 pb-12 lg:pt-40 lg:pb-20 overflow-hidden">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center relative z-10">
            <span class="inline-block py-1.5 px-4 rounded-full bg-indigo-50 border border-indigo-100 text-indigo-700 font-bold text-xs uppercase tracking-widest mb-6 shadow-sm">
                ⭐ Authorised Service Center
            </span>
            <h2 class="text-4xl md:text-6xl font-extrabold text-slate-900 mb-6 tracking-tight leading-tight">
                Premium Equipment <br/>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600">Sales & Service</span>
            </h2>
            <p class="text-lg md:text-xl text-slate-500 max-w-2xl mx-auto mb-10 font-medium">
                Experience crystal clear audio and stunning visuals. We provide top-tier repairs and exclusive high-end equipment.
            </p>
        </div>
        <!-- Decorative Background Gradient -->
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-full h-full max-w-4xl z-0 opacity-30 pointer-events-none">
            <div class="absolute top-20 left-10 w-72 h-72 bg-purple-400 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob"></div>
            <div class="absolute top-20 right-10 w-72 h-72 bg-indigo-400 rounded-full mix-blend-multiply filter blur-3xl opacity-70 animate-blob animation-delay-2000"></div>
        </div>
    </div>

    <!-- Product Grid Section -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-24">
        <div class="flex justify-between items-end mb-8 border-b border-slate-200 pb-4">
            <h3 class="text-2xl font-bold text-slate-800">Featured Products</h3>
        </div>
        <div id="product-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            <!-- Products loaded via JS -->
        </div>
    </div>

    <!-- Glassmorphism Cart Sidebar -->
    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full sm:w-[400px] glass-sidebar shadow-2xl border-l border-white/50 transform translate-x-full transition-transform duration-500 ease-in-out z-[60] flex flex-col">
        <div class="p-6 flex justify-between items-center border-b border-slate-200/60 bg-white/50">
            <h2 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
                <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                Your Cart
            </h2>
            <button onclick="toggleCart()" class="p-2 rounded-full hover:bg-slate-100 text-slate-500 hover:text-slate-800 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <div id="cart-items" class="flex-grow p-6 overflow-y-auto space-y-4">
            <!-- Cart items injected here -->
        </div>
        
        <div class="p-6 bg-slate-50/80 border-t border-slate-200/60">
            <div class="flex justify-between items-center mb-6">
                <span class="text-slate-500 font-medium">Subtotal</span>
                <h3 class="text-2xl font-extrabold text-slate-900">₹<span id="cart-total">0.00</span></h3>
            </div>
            
            <button onclick="checkout('919418703826')" class="w-full relative group overflow-hidden rounded-xl bg-premium text-white py-4 font-bold shadow-xl shadow-slate-800/20 transition-all hover:scale-[1.02] active:scale-[0.98]">
                <div class="absolute inset-0 w-full h-full bg-gradient-to-r from-indigo-600 to-purple-600 opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <span class="relative flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51a12.8 12.8 0 00-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                    Order on WhatsApp
                </span>
            </button>
            <p class="text-center text-xs text-slate-400 mt-4">Secure & direct ordering</p>
        </div>
    </div>

    <!-- Overlay -->
    <div id="cart-overlay" onclick="toggleCart()" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-300"></div>

    <script>
        let cart = [];

        // 1. Fetch Products from Backend API
        async function fetchProducts() {
            try {
                const response = await fetch('/api/products');
                const products = await response.json();
                
                const productList = document.getElementById('product-list');
                productList.innerHTML = ''; 

                if (!products || products.length === 0) {
                    productList.innerHTML = `
                        <div class="col-span-full text-center py-20">
                            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-100 text-slate-400 mb-4">
                                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path></svg>
                            </div>
                            <p class="text-lg font-medium text-slate-500">Inventory updating soon.</p>
                        </div>`;
                    return;
                }

                products.forEach(p => {
                    productList.innerHTML += `
                        <div class="group bg-white rounded-3xl shadow-sm border border-slate-100 hover:shadow-2xl hover:shadow-indigo-100 transition-all duration-300 overflow-hidden flex flex-col">
                            <div class="relative overflow-hidden aspect-[4/3] bg-slate-50">
                                <img src="${p.image_url}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 ease-out">
                                ${p.stock_count > 0 ? 
                                    '<span class="absolute top-4 left-4 bg-white/90 backdrop-blur text-slate-800 text-xs font-bold px-3 py-1 rounded-full shadow-sm">In Stock</span>' : 
                                    '<span class="absolute top-4 left-4 bg-red-500/90 backdrop-blur text-white text-xs font-bold px-3 py-1 rounded-full shadow-sm">Out of Stock</span>'}
                            </div>
                            <div class="p-6 flex flex-col flex-grow">
                                <h3 class="font-bold text-xl text-slate-900 mb-2 line-clamp-1">${p.name}</h3>
                                <p class="text-slate-500 text-sm line-clamp-2 mb-6 flex-grow">${p.description}</p>
                                <div class="flex justify-between items-center pt-4 border-t border-slate-100">
                                    <span class="font-extrabold text-2xl text-premium">₹${p.price}</span>
                                    <button onclick="addToCart(${p.id}, '${p.name.replace("'", "\\'")}', ${p.price})" class="bg-slate-900 text-white px-5 py-2.5 rounded-full hover:bg-indigo-600 text-sm font-bold shadow-md hover:shadow-lg transition-colors duration-300">
                                        Add to Cart
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Error fetching products:', error);
            }
        }

        // 2. Cart Logic
        function toggleCart() {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('cart-overlay');
            
            sidebar.classList.toggle('translate-x-full');
            
            if (sidebar.classList.contains('translate-x-full')) {
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            } else {
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            }
        }

        function addToCart(id, name, price) {
            const existingItem = cart.find(item => item.id === id);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ id, name, price, quantity: 1 });
            }
            updateCartUI();
            
            // Premium animation for cart icon
            const cartBtn = document.getElementById('cart-count');
            cartBtn.classList.add('scale-150', 'bg-purple-500');
            setTimeout(() => cartBtn.classList.remove('scale-150', 'bg-purple-500'), 300);
        }

        function updateCartUI() {
            const cartItems = document.getElementById('cart-items');
            const cartCount = document.getElementById('cart-count');
            const cartTotal = document.getElementById('cart-total');

            cartItems.innerHTML = '';
            let total = 0;
            let count = 0;

            if(cart.length === 0) {
                cartItems.innerHTML = '<div class="text-center text-slate-400 mt-10">Your cart is feeling a bit empty.</div>';
            }

            cart.forEach((item, index) => {
                total += item.price * item.quantity;
                count += item.quantity;
                cartItems.innerHTML += `
                    <div class="flex justify-between items-center p-4 bg-white rounded-2xl border border-slate-100 shadow-sm">
                        <div class="flex-grow">
                            <p class="font-bold text-slate-800">${item.name}</p>
                            <p class="text-sm font-medium text-indigo-600 mt-1">₹${item.price} <span class="text-slate-400 font-normal">x ${item.quantity}</span></p>
                        </div>
                        <div class="flex flex-col items-end gap-2">
                            <span class="font-extrabold text-slate-900">₹${item.price * item.quantity}</span>
                            <button onclick="removeFromCart(${index})" class="text-xs text-red-500 hover:text-red-700 font-semibold underline">Remove</button>
                        </div>
                    </div>
                `;
            });

            cartCount.innerText = count;
            cartTotal.innerText = total.toFixed(2);
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        // 3. WhatsApp Checkout
        function checkout(adminPhone) {
            if (cart.length === 0) {
                alert("Please add some products to your cart first!");
                return;
            }

            let message = "Hi! I want to order the following from your Audio/Video Service Center:%0A%0A";
            let total = 0;

            cart.forEach(item => {
                message += `🔹 *${item.name}*%0A   Qty: ${item.quantity} | Price: ₹${item.price * item.quantity}%0A`;
                total += item.price * item.quantity;
            });

            message += `%0A━━━━━━━━━━━━━━━━━%0A🔥 *Total Payable: ₹${total.toFixed(2)}*%0A━━━━━━━━━━━━━━━━━%0A%0AIs this available? Please share payment details.`;

            window.open(`https://wa.me/${adminPhone}?text=${message}`, '_blank');
        }

        // Initialize
        fetchProducts();
    </script>
</body>
</html>
