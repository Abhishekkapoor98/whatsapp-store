<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <!-- Navbar -->
    <nav class="bg-green-600 text-white p-4 shadow-md flex justify-between items-center fixed w-full top-0 z-10">
        <h1 class="text-2xl font-bold">🛒 My Store</h1>
        <button onclick="toggleCart()" class="bg-green-700 px-4 py-2 rounded font-semibold hover:bg-green-800 transition">
            Cart (<span id="cart-count">0</span>)
        </button>
    </nav>

    <!-- Product Grid -->
    <div class="container mx-auto mt-24 p-4">
        <div id="product-list" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Products will be loaded here via JavaScript -->
        </div>
    </div>

    <!-- Cart Sidebar -->
    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-80 bg-white shadow-2xl transform translate-x-full transition-transform duration-300 z-20 flex flex-col">
        <div class="p-4 bg-gray-800 text-white flex justify-between items-center">
            <h2 class="text-xl font-bold">Your Cart</h2>
            <button onclick="toggleCart()" class="text-red-400 hover:text-red-300 font-bold text-xl">&times;</button>
        </div>
        <div id="cart-items" class="flex-grow p-4 overflow-y-auto">
            <!-- Cart items will appear here -->
        </div>
        <div class="p-4 border-t bg-gray-50">
            <h3 class="text-lg font-bold mb-4">Total: ₹<span id="cart-total">0</span></h3>
            <!-- Updated WhatsApp Number Here -->
            <button onclick="checkout('919418703826')" class="w-full bg-green-500 text-white py-3 rounded-lg font-bold hover:bg-green-600 shadow-md flex items-center justify-center gap-2">
                Order on WhatsApp
            </button>
        </div>
    </div>

    <script>
        let cart = [];

        // 1. Fetch Products from Backend API
        async function fetchProducts() {
            try {
                const response = await fetch('/api/products');
                const products = await response.json();
                
                const productList = document.getElementById('product-list');
                productList.innerHTML = ''; // Clear loading state

                if (!products || products.length === 0) {
                    productList.innerHTML = '<p class="col-span-full text-center text-gray-500 mt-10">No products available right now.</p>';
                    return;
                }

                products.forEach(p => {
                    productList.innerHTML += `
                        <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-lg transition">
                            <img src="${p.image_url}" alt="${p.name}" class="w-full h-48 object-cover">
                            <div class="p-4">
                                <h3 class="font-bold text-lg text-gray-800">${p.name}</h3>
                                <p class="text-gray-500 text-sm h-10 overflow-hidden mt-1">${p.description}</p>
                                <div class="mt-4 flex justify-between items-center">
                                    <span class="font-bold text-green-600 text-xl">₹${p.price}</span>
                                    <button onclick="addToCart(${p.id}, '${p.name.replace("'", "\\'")}', ${p.price})" class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600 text-sm font-semibold">
                                        Add +
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Error fetching products:', error);
            }
        }

        // 2. Cart Logic
        function toggleCart() {
            const sidebar = document.getElementById('cart-sidebar');
            sidebar.classList.toggle('translate-x-full');
        }

        function addToCart(id, name, price) {
            const existingItem = cart.find(item => item.id === id);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ id, name, price, quantity: 1 });
            }
            updateCartUI();
            
            // Show small animation or feedback
            const cartBtn = document.getElementById('cart-count');
            cartBtn.classList.add('text-yellow-300', 'scale-125');
            setTimeout(() => cartBtn.classList.remove('text-yellow-300', 'scale-125'), 300);
        }

        function updateCartUI() {
            const cartItems = document.getElementById('cart-items');
            const cartCount = document.getElementById('cart-count');
            const cartTotal = document.getElementById('cart-total');

            cartItems.innerHTML = '';
            let total = 0;
            let count = 0;

            cart.forEach(item => {
                total += item.price * item.quantity;
                count += item.quantity;
                cartItems.innerHTML += `
                    <div class="flex justify-between items-center mb-3 pb-3 border-b border-gray-100">
                        <div>
                            <p class="font-semibold text-gray-800">${item.name}</p>
                            <p class="text-sm text-gray-500">₹${item.price} x ${item.quantity}</p>
                        </div>
                        <span class="font-bold text-gray-700">₹${item.price * item.quantity}</span>
                    </div>
                `;
            });

            cartCount.innerText = count;
            cartTotal.innerText = total.toFixed(2);
        }

        // 3. WhatsApp Checkout
        function checkout(adminPhone) {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }

            let message = "Hello! I would like to place an order:%0A%0A";
            let total = 0;

            cart.forEach(item => {
                message += `▪ ${item.quantity}x ${item.name} (₹${item.price})%0A`;
                total += item.price * item.quantity;
            });

            message += `%0A*Total: ₹${total.toFixed(2)}*%0A%0APlease let me know the payment details.`;

            // Open WhatsApp with pre-filled message
            window.open(`https://wa.me/${adminPhone}?text=${message}`, '_blank');
        }

        // Load products when page loads
        fetchProducts();
    </script>
</body>
</html>
