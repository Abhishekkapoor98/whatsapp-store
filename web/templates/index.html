<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Audio Video Center</title>
    <!-- Premium Font (Inter) for Apple-like typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        apple: '#1d1d1f',
                        appleBlue: '#0066cc',
                        appleGray: '#f5f5f7',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #ffffff; color: #1d1d1f; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d2d2d7; border-radius: 10px; }
        
        .glass-header { 
            background: rgba(255, 255, 255, 0.72); 
            backdrop-filter: saturate(180%) blur(20px); 
            -webkit-backdrop-filter: saturate(180%) blur(20px); 
        }
        
        .product-card {
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .product-card:hover {
            transform: scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>

    <!-- Apple-style Minimal Navbar -->
    <nav class="glass-header fixed w-full top-0 z-50 border-b border-gray-200/50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
            <div class="flex items-center gap-2 cursor-pointer">
                <svg class="w-7 h-7 text-apple" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
                <h1 class="text-xl font-semibold tracking-tight text-apple">AV Center</h1>
            </div>
            
            <button onclick="toggleCart()" class="flex items-center gap-2 bg-appleGray hover:bg-gray-200 text-apple px-4 py-1.5 rounded-full text-sm font-medium transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
                Cart <span id="cart-count" class="bg-apple text-white text-[10px] px-2 py-0.5 rounded-full ml-1">0</span>
            </button>
        </div>
    </nav>

    <!-- Ultra-Clean Hero Section -->
    <header class="pt-40 pb-20 text-center px-4">
        <h2 class="text-5xl md:text-7xl font-bold tracking-tighter text-apple mb-4">
            Hear the Unheard. <br/> See the Unseen.
        </h2>
        <p class="text-xl md:text-2xl text-gray-500 font-medium max-w-2xl mx-auto mb-6 tracking-tight">
            Authorised Service Center. Premium repairs and high-fidelity equipment designed for perfection.
        </p>
        <p class="text-sm font-semibold text-appleBlue tracking-wide uppercase">Experience the Pro Level</p>
    </header>

    <!-- Minimalist Product Grid -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-32">
        <div id="product-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
            <!-- Loading State -->
            <div class="col-span-full text-center py-20 text-gray-400">Loading premium collection...</div>
        </div>
    </main>

    <!-- Sleek Cart Sidebar -->
    <div id="cart-sidebar" class="fixed top-0 right-0 h-full w-full sm:w-[420px] bg-white shadow-[0_0_40px_rgba(0,0,0,0.1)] transform translate-x-full transition-transform duration-500 ease-[cubic-bezier(0.16,1,0.3,1)] z-[60] flex flex-col">
        
        <div class="p-8 flex justify-between items-center bg-white border-b border-gray-100">
            <h2 class="text-3xl font-bold tracking-tight text-apple">Bag</h2>
            <button onclick="toggleCart()" class="text-gray-400 hover:text-apple transition-colors p-2 bg-gray-50 rounded-full hover:bg-gray-100">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <div id="cart-items" class="flex-grow p-8 overflow-y-auto space-y-6">
            <!-- Cart items will appear here -->
        </div>
        
        <div class="p-8 bg-appleGray/50 border-t border-gray-100">
            <div class="flex justify-between items-center mb-8">
                <span class="text-lg font-medium text-gray-500">Total</span>
                <h3 class="text-3xl font-bold text-apple">₹<span id="cart-total">0.00</span></h3>
            </div>
            
            <button onclick="checkout('919418703826')" class="w-full bg-apple text-white py-4 rounded-2xl font-semibold text-lg shadow-lg hover:bg-black hover:scale-[1.02] transition-all duration-300 flex justify-center items-center gap-2">
                Checkout via WhatsApp
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </div>
    </div>

    <!-- Background Overlay for Cart -->
    <div id="cart-overlay" onclick="toggleCart()" class="fixed inset-0 bg-black/20 backdrop-blur-sm z-50 hidden opacity-0 transition-opacity duration-500"></div>

    <script>
        let cart = [];

        async function fetchProducts() {
            try {
                const response = await fetch('/api/products');
                const products = await response.json();
                
                const productList = document.getElementById('product-list');
                productList.innerHTML = ''; 

                if (!products || products.length === 0) {
                    productList.innerHTML = '<p class="col-span-full text-center text-gray-500 text-lg">Our collection is currently being updated.</p>';
                    return;
                }

                products.forEach(p => {
                    productList.innerHTML += `
                        <div class="product-card bg-appleGray rounded-[2rem] p-6 flex flex-col">
                            <div class="relative w-full aspect-square rounded-2xl overflow-hidden mb-6 bg-white">
                                <img src="${p.image_url}" alt="${p.name}" class="w-full h-full object-contain p-4 mix-blend-multiply">
                                ${p.stock_count > 0 ? '' : '<span class="absolute top-4 left-4 bg-white/90 text-red-500 text-[11px] font-bold px-3 py-1 rounded-full uppercase tracking-wider">Sold Out</span>'}
                            </div>
                            
                            <div class="flex flex-col flex-grow">
                                <h3 class="font-semibold text-xl text-apple mb-2 leading-tight">${p.name}</h3>
                                <p class="text-gray-500 text-sm line-clamp-2 mb-6 flex-grow leading-relaxed">${p.description}</p>
                                
                                <div class="flex justify-between items-center mt-auto pt-4">
                                    <span class="font-semibold text-lg text-apple">₹${p.price}</span>
                                    <button onclick="addToCart(${p.id}, '${p.name.replace("'", "\\'")}', ${p.price})" class="bg-apple text-white px-5 py-2 rounded-full text-sm font-medium hover:bg-black hover:scale-105 transition-all">
                                        Buy
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Error fetching products:', error);
            }
        }

        function toggleCart() {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('cart-overlay');
            
            sidebar.classList.toggle('translate-x-full');
            
            if (sidebar.classList.contains('translate-x-full')) {
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 500);
            } else {
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            }
        }

        function addToCart(id, name, price) {
            const existingItem = cart.find(item => item.id === id);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ id, name, price, quantity: 1 });
            }
            updateCartUI();
            
            // Subtle pulse animation
            const cartBtn = document.getElementById('cart-count');
            cartBtn.classList.add('bg-appleBlue', 'scale-125');
            setTimeout(() => cartBtn.classList.remove('bg-appleBlue', 'scale-125'), 200);
        }

        function updateCartUI() {
            const cartItems = document.getElementById('cart-items');
            const cartCount = document.getElementById('cart-count');
            const cartTotal = document.getElementById('cart-total');

            cartItems.innerHTML = '';
            let total = 0;
            let count = 0;

            if(cart.length === 0) {
                cartItems.innerHTML = '<div class="text-center text-gray-400 mt-10 text-lg">Your bag is empty.</div>';
            }

            cart.forEach((item, index) => {
                total += item.price * item.quantity;
                count += item.quantity;
                cartItems.innerHTML += `
                    <div class="flex justify-between items-start pb-6 border-b border-gray-100 last:border-0">
                        <div>
                            <p class="font-semibold text-lg text-apple">${item.name}</p>
                            <div class="flex items-center gap-3 mt-1">
                                <p class="text-gray-500 font-medium">₹${item.price}</p>
                                <span class="text-gray-300">|</span>
                                <p class="text-gray-500">Qty: ${item.quantity}</p>
                            </div>
                        </div>
                        <div class="flex flex-col items-end gap-2">
                            <span class="font-semibold text-lg text-apple">₹${item.price * item.quantity}</span>
                            <button onclick="removeFromCart(${index})" class="text-sm text-appleBlue hover:underline font-medium">Remove</button>
                        </div>
                    </div>
                `;
            });

            cartCount.innerText = count;
            cartTotal.innerText = total.toFixed(2);
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function checkout(adminPhone) {
            if (cart.length === 0) {
                alert("Please add products to your bag first.");
                return;
            }

            let message = "Hi! I would like to order the following premium items:%0A%0A";
            let total = 0;

            cart.forEach(item => {
                message += `▪ *${item.name}*%0A   Quantity: ${item.quantity} | Price: ₹${item.price * item.quantity}%0A`;
                total += item.price * item.quantity;
            });

            message += `%0A═════════════════%0A*Total Amount: ₹${total.toFixed(2)}*%0A═════════════════%0A%0AIs this in stock? Please guide me with the payment process.`;

            window.open(`https://wa.me/${adminPhone}?text=${message}`, '_blank');
        }

        fetchProducts();
    </script>
</body>
</html>
